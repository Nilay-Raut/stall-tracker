# Local development database only.
# The production compose file (app + db + caddy) is added in Phase 2.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stall
      POSTGRES_PASSWORD: stall_dev_password
      POSTGRES_DB: stall
    ports:
      # Bound to this machine only, never to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stall -d stall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
